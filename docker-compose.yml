services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: caresense
      POSTGRES_USER: caresense
      POSTGRES_PASSWORD: caresense
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caresense"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://caresense:caresense@postgres:5432/caresense
      REDIS_URL: redis://redis:6379
    command: ["npm", "run", "migrate:prod"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://caresense:caresense@postgres:5432/caresense
      REDIS_URL: redis://redis:6379
      PORT: ${PORT:-3000}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["npm", "start"]
  worker:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://caresense:caresense@postgres:5432/caresense
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["npm", "run", "start:worker"]
volumes:
  postgres-data:
  redis-data:
